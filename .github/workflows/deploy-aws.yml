name: Deploy AWS
on:
  workflow_dispatch:
concurrency:
  group: coordinaite-production-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ fromJSON(vars.AWS_DEPLOY_CONFIG).region }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      REPOSITORY_URL: ${{ fromJSON(vars.AWS_DEPLOY_CONFIG).repository_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ fromJSON(vars.AWS_DEPLOY_CONFIG).github_role_arn }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Write non-secret deployment configuration
        env:
          CONFIG_JSON: ${{ vars.AWS_DEPLOY_CONFIG }}
        run: |
          python -c "import json,os,pathlib; pathlib.Path('release-config.json').write_text(json.dumps(json.loads(os.environ['CONFIG_JSON'])))"
      - run: python -m pip install -r scripts/requirements.txt
      - name: Build and push the immutable release image
        run: |
          registry_host="${REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry_host"
          docker build --platform linux/amd64 -t "$REPOSITORY_URL:$IMAGE_TAG" backend
          docker push "$REPOSITORY_URL:$IMAGE_TAG"
      - name: Migrate, deploy, and verify
        run: python scripts/deploy_aws.py --image "$REPOSITORY_URL:$IMAGE_TAG"
