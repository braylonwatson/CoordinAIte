name: CI
on:
  pull_request:
  push:
    branches: [main, refactor/production-backend, deploy/aws-foundation]
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: coordinaite_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d coordinaite_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/coordinaite_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip install -r scripts/requirements.txt
      - run: python -m pytest -q ops_tests
      - run: python -m pytest -q
        working-directory: backend
      - name: Build API image
        run: docker build -t coordinaite:ci backend
      - name: Migrate disposable database and boot the container
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/coordinaite_test
          JWT_SECRET_KEY: ci-only-signing-key-not-valid-for-production-123456789
        run: |
          docker run --rm --network host -e DATABASE_URL coordinaite:ci python -m alembic -c alembic.ini upgrade head
          docker run -d --name coordinaite-ci --read-only --network host -e DATABASE_URL -e JWT_SECRET_KEY -e REALTIME_ENABLED=true coordinaite:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8000/health/ready; then
              break
            fi
            sleep 3
          done
          python scripts/smoke_api.py http://127.0.0.1:8000 --ws-url ws://127.0.0.1:8000/ws/predictions
      - name: Container logs on failure
        if: failure()
        run: docker logs coordinaite-ci
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false --runInBand
        env:
          CI: "true"
      - run: npm run build
        env:
          REACT_APP_API_URL: /api
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.3"
      - run: terraform -chdir=infra/aws fmt -check
      - run: terraform -chdir=infra/aws init -backend=false -input=false
      - run: terraform -chdir=infra/aws validate
